<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; background: #aad3df; }
  body.dark #map { background: #1b1f24; }
  body.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9); }
  body { position: relative; overflow: hidden; }
  #hover, #panel { font: 13px/1.4 system-ui, sans-serif; color: var(--text); background: var(--surface);
                   border: 1px solid var(--border); box-sizing: border-box; z-index: 1100; position: absolute; }
  #hover { display: none; width: 290px; max-height: calc(100% - 16px); overflow: hidden; padding: 12px 14px;
           border-radius: 14px; box-shadow: 0 6px 22px rgba(0,0,0,.28); pointer-events: none; }
  #hover dd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #panel { top: 10px; right: 10px; bottom: 10px; width: 340px; max-width: calc(100% - 20px); overflow-y: auto; padding: 16px;
           border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.32);
           transform: translateX(calc(100% + 24px)); transition: transform .2s ease; visibility: hidden; }
  #panel.open { transform: none; visibility: visible; }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); }
  .who { flex: 1; min-width: 0; }
  .name { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
  .sub, .hint { color: var(--dim); font-size: 12px; }
  .hint { margin-top: 10px; }
  h4 { margin: 14px 0 5px; padding-bottom: 4px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
       color: var(--dim); border-bottom: 1px solid var(--border); }
  dl { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 3px 10px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; overflow-wrap: anywhere; user-select: text; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  button { font: 500 12px system-ui, sans-serif; color: var(--text); background: var(--surface); cursor: pointer;
           border: 1px solid var(--border); border-radius: 14px; padding: 6px 12px; }
  button:hover { background: var(--raised); border-color: var(--accent); }
  button.main { font-weight: 600; color: var(--on_accent); border-color: var(--accent);
                background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  button.close { flex: none; width: 28px; height: 28px; padding: 0; font-size: 18px; line-height: 1; }
  .label { background: none; border: none; box-shadow: none; font: 600 11px system-ui, sans-serif;
           color: #222; text-shadow: 0 0 3px #fff, 0 0 3px #fff; padding: 0; }
  body.dark .label { color: #eee; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .label::before { display: none; }
  .legend { background: rgba(255,255,255,.9); padding: 6px 9px; border-radius: 6px; font: 12px system-ui, sans-serif;
            line-height: 1.6; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  body.dark .legend { background: rgba(30,34,40,.92); color: #ddd; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px;
              vertical-align: -1px; border: 1.5px solid rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="map"></div>
<div id="hover"></div>
<aside id="panel"></aside>
<script>
const COLORS = {1: "#2f81f7", 2: "#e5534b", 3: "#a371f7", 4: "#3fb950", self: "#f0b429"};
const TYPES = {1: "Chat", 2: "Repeater", 3: "Room", 4: "Sensor"};
const map = L.map("map", {zoomControl: true, worldCopyJump: true}).setView([20, 0], 2);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const nodes = L.layerGroup().addTo(map);
const route = L.layerGroup().addTo(map);
const ring = L.layerGroup().addTo(map);
let markers = {}, fitted = false, showLabels = true, last = null, accent = "#0d7f74";

const legend = L.control({position: "bottomleft"});
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = Object.entries(TYPES).map(([k, v]) => `<i style="background:${COLORS[k]}"></i>${v}`).join("<br>")
    + `<br><i style="background:${COLORS.self}"></i>You`;
  return d;
};
legend.addTo(map);

// The app listens for these on the console.
function tell(what, arg) { console.info("meshcore:" + what + ":" + arg); }

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]); }

function sections(n) {
  return n.sections.map(s => `<h4>${esc(s.title)}</h4><dl>` +
    s.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("") + `</dl>`).join("");
}

function color(n) { return n.self ? COLORS.self : (COLORS[n.type] || "#888"); }

function head(n) {
  return `<div class="head"><i class="dot" style="background:${color(n)}"></i>` +
    `<div class="who"><div class="name">${esc(n.name)}</div><div class="sub">${esc(n.sub)}</div></div>`;
}

// --- hover card -------------------------------------------------------------
const hoverEl = document.getElementById("hover"), panelEl = document.getElementById("panel");

function showHover(n, pt) {
  hoverEl.innerHTML = head(n) + `</div>` + sections(n) + `<div class="hint">Click for the side panel</div>`;
  hoverEl.style.display = "block";
  const size = map.getSize(), room = size.x - (selected ? panelEl.offsetWidth + 12 : 0);
  const w = hoverEl.offsetWidth, h = hoverEl.offsetHeight;
  let x = pt.x + 16;
  if (x + w > room - 8) x = pt.x - w - 16;
  hoverEl.style.left = Math.max(8, x) + "px";
  hoverEl.style.top = Math.max(8, Math.min(pt.y - 24, size.y - h - 8)) + "px";
}
function hideHover() { hoverEl.style.display = "none"; }

// --- side panel --------------------------------------------------------------
let selected = null;  // the node's key

function renderPanel(n) {
  const scroll = panelEl.scrollTop;
  panelEl.innerHTML = head(n) + `<button class="close" data-act="close" title="Close (Esc)">×</button></div>` +
    `<div class="actions">` + n.actions.map(([a, label], i) =>
      `<button data-act="${esc(a)}"${i ? "" : ' class="main"'}>${esc(label)}</button>`).join("") + `</div>` + sections(n);
  panelEl.scrollTop = scroll;
}

function markSelected(n) {
  ring.clearLayers();
  if (n) L.circleMarker([n.lat, n.lon], {radius: 15, color: accent, weight: 3, fill: false, interactive: false}).addTo(ring);
}

function openPanel(n) {
  hideHover();
  selected = n.key;
  panelEl.scrollTop = 0;
  renderPanel(n);
  panelEl.classList.add("open");
  markSelected(n);
  map.panInside([n.lat, n.lon], {paddingTopLeft: [40, 40], paddingBottomRight: [panelEl.offsetWidth + 40, 40]});
}

function closePanel() {
  selected = null;
  panelEl.classList.remove("open");
  ring.clearLayers();
}

panelEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b || !selected) return;
  const act = b.dataset.act, n = last.find(x => x.key === selected);
  if (act === "close") closePanel();
  else if (act === "route") showRoute(selected);
  else if (act === "zoom" && n) { map.setView([n.lat, n.lon], Math.max(map.getZoom(), 14)); }
  else tell(act, selected);
});
L.DomEvent.disableScrollPropagation(panelEl);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

// Called from Python with every contact that has a location.
function setNodes(data, opts) {
  last = data;
  showLabels = opts.labels;
  document.body.classList.toggle("dark", !!opts.dark);
  for (const [k, v] of Object.entries(opts.colors)) if (typeof v === "string") document.body.style.setProperty("--" + k, v);
  accent = opts.colors.accent;
  hideHover();  // its marker is about to be replaced
  nodes.clearLayers();
  markers = {};
  const pts = [];
  for (const n of data) {
    const m = L.circleMarker([n.lat, n.lon], {
      radius: n.self ? 9 : n.type === 2 ? 7 : 6, color: "#000", weight: 1.5, opacity: n.stale ? 0.4 : 0.9,
      fillColor: color(n), fillOpacity: n.stale ? 0.35 : 0.9, bubblingMouseEvents: false
    });
    m.on("mouseover", e => showHover(n, e.containerPoint));
    m.on("mouseout", hideHover);
    m.on("click", () => openPanel(n));
    if (showLabels) m.bindTooltip(esc(n.name), {permanent: true, direction: "right", offset: [8, 0], className: "label"});
    m.addTo(nodes);
    markers[n.key] = m;
    pts.push([n.lat, n.lon]);
  }
  map.invalidateSize();  // the tab may have been hidden when the map last measured itself
  if (!fitted && pts.length && map.getSize().x > 300) { fit(); fitted = true; }  // not while it's hidden
  if (selected) {  // keep the open panel current; a node filtered away just loses its ring
    const n = data.find(x => x.key === selected);
    if (n) renderPanel(n);
    markSelected(n);
  }
}

function fit() {
  if (!last || !last.length) return;
  const b = L.latLngBounds(last.map(n => [n.lat, n.lon]));
  map.fitBounds(b.pad(0.15), {maxZoom: 13});
}

function focusNode(key) {
  const m = markers[key];
  if (!m) return false;
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 11));
  openPanel(last.find(x => x.key === key));
  return true;
}

// The route our node would use: us, then each repeater with a known location.
function showRoute(key) {
  route.clearLayers();
  const n = last.find(x => x.key === key), me = last.find(x => x.self);
  if (!n) return;
  const pts = [];
  if (me) pts.push([me.lat, me.lon]);
  for (const h of n.route || []) if (h) pts.push([h.lat, h.lon]);
  pts.push([n.lat, n.lon]);
  L.polyline(pts, {color: "#f0b429", weight: 4, opacity: 0.85, dashArray: (n.route || []).some(h => !h) ? "8 6" : null})
    .addTo(route);
  map.fitBounds(L.latLngBounds(pts).pad(0.2), {maxZoom: 13});
}

map.on("click", () => { route.clearLayers(); closePanel(); });
map.on("movestart zoomstart", hideHover);
</script>
</body>
</html>
